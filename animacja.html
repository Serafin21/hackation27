<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergoPatrol – animacja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a short, calm product film for a pitch, readable for every age
   IDEA   a shipped mobile app filmed on a phone, in Cementownia Warta's own navy and green
   PICTURE one large phone, the scripted flow running inside it; big caption beside it
   COLOUR deep navy #04243E stage, section navy #1E3E72, brand green #82C63F, ink #101828, paper #F9F9FB
   TYPE   Open Sans 800 for titles, Open Sans 400–700 for UI
   LAYOUT laptop: caption left, phone right; phone: caption above, phone below */
:root{--deep:#04243E;--navy:#1E3E72;--brand:#0B3A72;--green:#82C63F;--green-d:#4F8A16;--ink:#101828;--paper:#F9F9FB;--line:#E3E7EE;--muted:#667085;--s:1}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--deep);color:#fff;font:16px/1.4 'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1.2px,transparent 1.6px) 0 0/24px 24px,linear-gradient(155deg,#123764 0%,#04243E 62%)}
#stage::before{content:"";position:absolute;width:120vmax;height:120vmax;border-radius:50%;right:-70vmax;top:-60vmax;background:#1E3E72;opacity:.55}
#main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(28px,6vw,96px);padding:18px}
#cap{width:clamp(300px,26vw,470px)}
#capStep{color:var(--green);font-weight:700;font-size:clamp(15px,1.2vw,20px);margin:0 0 10px}
#capText{font-size:clamp(28px,2.5vw,46px);line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance;min-height:4.4em}
.dots{display:flex;gap:6px;margin-top:18px}
.dots i{width:30px;height:6px;border-radius:3px;background:rgba(255,255,255,.22);transition:background .3s}
.dots i.a{background:var(--green)}
.note{font-size:13px;opacity:.6;margin-top:26px}
#phoneWrap{width:calc(410px*var(--s));height:calc(840px*var(--s));flex:none}
#phone{width:410px;height:840px;transform:scale(var(--s));transform-origin:0 0;background:#0A101B;border-radius:60px;padding:14px;box-shadow:0 40px 90px rgba(0,0,0,.5),inset 0 0 0 2px #2A3547}
#screen{position:relative;width:382px;height:812px;border-radius:46px;overflow:hidden;background:#04243E;color:var(--ink)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:31px;border-radius:20px;background:#000;z-index:60}
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 38px;font-weight:700;font-size:15px;z-index:55;color:#fff;transition:color .3s}
#screen.lt .sb{color:var(--ink)}
.layer{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s,transform .6s cubic-bezier(.3,.8,.3,1),visibility 0s .6s}
.layer.on{opacity:1;visibility:visible;transition:opacity .45s,transform .6s cubic-bezier(.3,.8,.3,1),visibility 0s}
.layer.slide{transform:translateX(100%)}
.layer.slide.on{transform:none}
.layer.gone{transform:translateX(-30%)}
.btn{border:0;border-radius:14px;font:700 16px 'Open Sans',sans-serif;padding:15px;text-align:center}
.touch{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(130,198,63,.55);border:2px solid rgba(255,255,255,.9);pointer-events:none;z-index:80;transform:translate(-50%,-50%)}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
/* phone home screen */
#l-home{background:linear-gradient(165deg,#3B6FAA 0%,#17416F 48%,#04243E 100%);overflow:hidden}
#l-home::before{content:"";position:absolute;width:460px;height:460px;border-radius:50%;left:-170px;top:330px;background:radial-gradient(circle,rgba(130,198,63,.32),rgba(130,198,63,0) 70%)}
#l-home::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-160px;top:-120px;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.apps{position:absolute;top:80px;left:18px;right:18px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:22px;z-index:1}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11.5px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap}
.ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25);position:relative}
.ic.ep::after{content:"";position:absolute;inset:-7px;border-radius:21px;border:3px solid var(--green);animation:ring 1.2s ease-out infinite}
.cal{display:flex;flex-direction:column;align-items:center;line-height:1}
.cal small{color:#E0483E;font-size:10px;font-weight:800;text-shadow:none}
.cal b{font-size:26px;color:#101828;text-shadow:none;margin-top:2px}
.pdots{position:absolute;bottom:128px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:1}
.pdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.pdots i:first-child{background:#fff}
.dock{position:absolute;left:14px;right:14px;bottom:22px;height:92px;border-radius:30px;background:rgba(255,255,255,.2);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));place-items:center;z-index:1}
/* bottom navigation shared by all app screens */
.gnav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:12px;z-index:40;transform:translateY(100%);transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.gnav.on{transform:none}
.gnav .hl{position:absolute;top:6px;left:0;width:25%;height:50px;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.gnav .hl::before{content:"";position:absolute;inset:0 7px;border-radius:14px;background:var(--green)}
.gnav[data-a="1"] .hl{transform:translateX(100%)}
.gnav[data-a="2"] .hl{transform:translateX(200%)}
.gnav[data-a="3"] .hl{transform:translateX(300%)}
.gnav div{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:#98A2B3;transition:color .3s}
.gnav div svg{stroke:currentColor}
.gnav div.a{color:var(--deep)}
/* camera */
#l-cam{background:#000;overflow:hidden}
#camSvg{position:absolute;inset:0;width:100%;height:100%}
.camhint{position:absolute;top:66px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:16px;padding:9px 18px;border-radius:22px;white-space:nowrap}
.focus{position:absolute;left:111px;top:352px;width:160px;height:160px;animation:fp 1.4s ease-in-out infinite}
@keyframes fp{50%{transform:scale(.93)}}
.focus b{position:absolute;width:32px;height:32px;border:4px solid #fff;transition:border-color .2s}
.focus .a{left:0;top:0;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.focus .b{right:0;top:0;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.focus .c{left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 12px}
.focus .d{right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 12px 0}
.focus.ok b{border-color:var(--green)}
.cambar{position:absolute;left:0;right:0;bottom:74px;height:170px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.78) 45%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding-bottom:16px;color:#fff;font-weight:700;font-size:14px}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center}
.shutter::after{content:"";width:58px;height:58px;border-radius:50%;background:#fff}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
.w{animation:hl 1.1s ease-out infinite;transform-box:fill-box}
.wr{animation-name:hr}
.w2{animation-delay:.35s}
.w3{animation-delay:.7s}
@keyframes hl{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(-14px,16px)}}
@keyframes hr{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,16px)}}
/* form */
#l-form,#l-app,#l-rank,#l-post{background:var(--paper)}
.hdr{background:var(--navy);color:#fff;padding:56px 18px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hdr h3{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.hdr p{margin:2px 0 0;opacity:.78;font-size:13px}
.pill{background:rgba(255,255,255,.16);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.fb{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.lab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.who{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center}
.ph{position:relative;width:86px;height:86px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#2B1913}
.ph svg{display:block;width:100%;height:100%}
.phok{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.ro{background:#ECEFF3;border-radius:12px;padding:10px 12px;color:#8E97A5;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ro span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okt{font-size:13px;font-weight:700;color:var(--green-d);margin-top:7px}
.lrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.lrow .lab{margin:0}
.hint{font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap}
.hint.ok{color:var(--green-d)}
.map{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
#mapSvg #world{transform-origin:0 0;transition:transform .7s cubic-bezier(.3,.8,.3,1)}
#mapSvg.z #world{transform:translate(-550.2px,-227px) scale(2.6)}
.ml{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;font-family:'Open Sans',sans-serif;font-weight:600}
#lblFar{transition:opacity .25s}
#mapSvg.z #lblFar{opacity:0}
#lblNear{opacity:0;transition:opacity .3s}
#mapSvg.z #lblNear{opacity:1;transition-delay:.45s}
.mzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden}
.mzoom span{width:26px;height:24px;display:grid;place-items:center;font-size:17px;font-weight:600;color:#5F6368;line-height:1}
.mzoom span+span{border-top:1px solid #E3E5E8}
.mscale{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#3C4043;background:rgba(255,255,255,.85);border-radius:4px;padding:1px 6px}
.mscale i{display:block;width:34px;height:5px;border:1.5px solid #3C4043;border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13px;line-height:1.15;font-weight:600;transition:all .25s}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.sizebox{max-height:0;opacity:0;overflow:hidden;margin-top:-8px;transition:max-height .45s,opacity .35s,margin-top .45s}
.sizebox.on{max-height:100px;opacity:1;margin-top:0}
.szg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sz{display:flex;flex-direction:column;align-items:center;padding:6px 4px;text-align:center}
.sz b{font-size:13px}
.sz small{font-size:11px;font-weight:600;opacity:.75}
.estc{width:310px;margin-top:6px;background:var(--deep);color:#fff;border-radius:16px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;opacity:0;transform:translateY(12px);transition:all .4s}
.estc.on{opacity:1;transform:none}
.estc small{display:block;font-size:11px;opacity:.7;font-weight:600}
.estc strong{font-size:18px;white-space:nowrap}
.estc .r{text-align:right}
.send{background:var(--green);color:var(--deep);width:100%;padding:13px}
.okov{position:absolute;inset:0;background:rgba(249,249,251,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;z-index:20;text-align:center;padding:0 26px 74px}
.okov.on{opacity:1;visibility:visible;transition:opacity .35s,visibility 0s}
.okov h4{margin:6px 0 0;font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.okov p{margin:0;color:var(--muted);font-size:14px}
.ck circle{fill:var(--green)}
.ck path{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;transition:stroke-dashoffset .5s .15s}
.on .ck path,.done .ck path{stroke-dashoffset:0}
/* waiting for maintenance */
#l-wait{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:74px}
.wb{display:flex;flex-direction:column;align-items:center;gap:14px}
.wb h4{margin:4px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.wb p{margin:0;color:var(--muted);font-size:14px}
.hg{animation:flip 1.5s ease-in-out infinite}
@keyframes flip{0%,62%{transform:rotate(0)}100%{transform:rotate(180deg)}}
.grain{animation:fall .5s linear infinite}
@keyframes fall{from{transform:translateY(0);opacity:1}to{transform:translateY(26px);opacity:.2}}
#w2{display:none}
#l-wait.done #w1{display:none}
#l-wait.done #w2{display:flex}
#l-wait.done h4{color:var(--green-d)}
.ck2{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:none}}
/* your impact */
.ac{position:absolute;top:128px;left:0;right:0;bottom:74px;overflow:hidden}
#acIn{position:relative;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(16,24,40,.06);opacity:0;transform:translateY(18px);transition:opacity .45s,transform .45s}
.card.on{opacity:1;transform:none}
.ct{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st b{display:block;font-size:25px;font-weight:800;color:var(--navy);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.st span{font-size:12px;color:var(--muted);font-weight:600}
.cmp{display:flex;gap:10px;align-items:center;margin-top:12px;background:#EFF7E6;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;color:#2C4A0E;opacity:0;transform:translateY(6px);transition:all .4s}
.cmp.on{opacity:1;transform:none}
.cmp svg{flex:none}
.vo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);margin-top:7px;font-size:13px;font-weight:600;transition:border-color .3s,background .3s}
.vo em{font-style:normal;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.vo .bar{grid-column:1/-1;height:6px;background:#EDF0F4;border-radius:4px;overflow:hidden}
.vo .bar i{display:block;height:100%;background:#9DB0CC;transition:width .9s cubic-bezier(.3,.8,.3,1)}
.vo.sel{border-color:var(--green);background:#F6FBF0}
.vo.sel .bar i{background:var(--green)}
.vo.sel em{color:var(--green-d)}
.vmsg{margin-top:10px;font-size:13px;font-weight:700;color:var(--green-d);opacity:0;transition:opacity .4s}
.vmsg.on{opacity:1}
#push{position:absolute;top:52px;left:10px;right:10px;z-index:45;background:rgba(255,255,255,.97);border-radius:20px;padding:12px;display:flex;gap:11px;align-items:center;box-shadow:0 14px 36px rgba(4,36,62,.28);transform:translateY(-170px);transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
#push.on{transform:none}
#push .pi{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;flex:none}
#push small{display:block;font-size:11px;color:var(--muted);font-weight:600}
#push strong{display:block;font-size:14px}
#push span{font-size:13px;color:#344054}
/* ranking */
.seg{position:absolute;top:128px;left:14px;right:14px;height:46px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;z-index:2}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--navy);transition:transform .4s cubic-bezier(.3,.8,.3,1)}
.seg[data-v="1"] i{transform:translateX(100%)}
.seg[data-v="2"] i{transform:translateX(200%)}
.seg span{position:relative;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted);transition:color .3s}
.seg span.a{color:#fff}
.pan{position:absolute;top:186px;left:14px;right:14px;bottom:86px;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .35s,transform .35s,visibility 0s .35s}
.pan.on{opacity:1;visibility:visible;transform:none;transition:opacity .35s,transform .35s,visibility 0s}
.pr{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 0 0 1px var(--line);margin-bottom:8px;opacity:0;transform:translateX(16px);transition:opacity .35s,transform .35s}
#pO.on .pr{opacity:1;transform:none}
.pr.me{box-shadow:0 0 0 2px var(--green);background:#F6FBF0}
.rk{font-size:17px;font-weight:800;text-align:center}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.pn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn em{font-style:normal;font-size:11px;background:var(--green);color:var(--deep);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.pn span{font-size:12px;color:var(--muted);font-weight:600}
.pz{text-align:right}
.pz b{display:block;font-size:15px;font-weight:800;color:var(--navy);white-space:nowrap}
.pz span{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.zt{margin:2px 0 0;text-align:center;font-size:14px;font-weight:600;color:#344054}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;height:330px}
.bc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;text-align:center}
.amt{font-size:17px;font-weight:800;white-space:nowrap;margin-bottom:2px}
.tag{font-size:11px;font-weight:800;color:var(--deep);background:var(--green);border-radius:8px;padding:3px 8px;margin-bottom:6px;white-space:nowrap}
.bc svg{display:block;margin-bottom:-6px;position:relative;z-index:1}
.bar{display:block;width:72%;height:0;border-radius:14px 14px 4px 4px;transition:height 1s cubic-bezier(.3,.8,.3,1)}
#pZ.on .bar{height:var(--h)}
.bn{margin-top:8px;font-size:14px;font-weight:800}
.bs{font-size:12px;color:var(--muted);font-weight:600}
.fc{background:#fff;border-radius:18px;padding:16px;box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(16,24,40,.06)}
.bigz{font-size:40px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.fs{margin:3px 0 0;font-size:13px;color:var(--muted)}
.stats2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.share{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EDF0F4}
.share span{width:0;transition:width 1s cubic-bezier(.3,.8,.3,1)}
#pF.on .share span{width:var(--w)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;font-weight:700;color:#344054}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* shutdowns */
.list{position:absolute;top:128px;left:0;right:0;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center;background:#fff;border-radius:14px;padding:11px 12px;box-shadow:0 0 0 1px var(--line)}
.cb{grid-column:1;grid-row:1/span 2;width:26px;height:26px;border-radius:8px;border:2px solid #B8C1CE;display:grid;place-items:center;transition:all .25s}
.cb svg{opacity:0;transition:opacity .2s}
.row.ck .cb{background:var(--green);border-color:var(--green)}
.row.ck .cb svg{opacity:1}
.rn{grid-column:2;grid-row:1;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{grid-column:2;grid-row:2;font-size:12px;color:var(--muted)}
.stp{grid-column:3;grid-row:1/span 2;display:flex;align-items:center;gap:4px}
.stp span{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--navy);background:#fff;line-height:1}
.stp b{min-width:42px;text-align:center;font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.gain{grid-column:2/span 2;grid-row:3;font-size:12px;font-weight:700;color:var(--green-d);background:#EFF7E6;border-radius:8px;padding:4px 8px;justify-self:start;white-space:nowrap;max-height:0;opacity:0;padding-block:0;transition:all .35s}
.row.ck .gain{max-height:30px;opacity:1;padding-block:4px;margin-top:5px}
.sum{position:absolute;left:14px;right:14px;bottom:86px;background:var(--deep);color:#fff;border-radius:16px;padding:12px}
.sum small{font-size:11px;opacity:.7;font-weight:600}
.sum .v{font-size:17px;font-weight:800;margin:2px 0 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
#appr{width:100%;background:#3B5677;color:#9FB2C8;transition:background .3s,color .3s}
#appr.ready{background:var(--green);color:var(--deep)}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;margin-top:8px}
.big3 div{background:#fff;border-radius:14px;padding:12px 4px;box-shadow:0 0 0 1px var(--line)}
.big3 b{display:block;font-size:25px;font-weight:800;color:var(--navy);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.big3 span{font-size:12px;color:var(--muted);font-weight:600}
#postOk .cmp{margin-top:14px;text-align:left}
/* player controls */
#ctl{position:fixed;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;z-index:100;transition:opacity .4s}
#ctl button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;font:700 17px 'Open Sans',sans-serif;cursor:pointer;flex:none}
#ctl button:hover{background:rgba(255,255,255,.26)}
#ctl button:focus-visible,#go:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.prog{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none;outline:none}
.track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--green)}
.tick{position:absolute;top:10px;width:2px;height:10px;margin-left:-1px;border-radius:1px;background:rgba(255,255,255,.6);pointer-events:none}
#knob{position:absolute;top:8px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:none;transition:transform .15s}
.prog:hover #knob,.prog.drag #knob,.prog:focus-visible #knob{transform:scale(1.3)}
#stage.seeking *,#stage.seeking *::before,#stage.seeking *::after{transition:none!important}
@media (max-width:600px){#bMute,#tm{display:none}#ctl{gap:6px}}
#tm{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.85}
#ctl.hid{opacity:0;pointer-events:none}
#startOv{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,36,62,.6);text-align:center;padding:20px}
#startOv.hide{display:none}
#go{background:var(--green);color:var(--deep);border:0;border-radius:16px;padding:16px 28px;font:800 20px 'Open Sans',sans-serif;cursor:pointer;min-height:44px}
#startOv p{margin:0;font-size:14px;opacity:.8}
@media (max-width:899px){
#main{flex-direction:column;gap:10px;justify-content:flex-start;padding-top:12px}
#cap{width:auto;max-width:440px;text-align:center}
#capText{font-size:20px;min-height:2.3em}
#capStep{margin-bottom:4px;font-size:13px}
.dots{justify-content:center;margin-top:6px}
.note{display:none}
}
</style>
</head>

<script>

const stage=document.getElementById('stage'),tpl=document.getElementById('tpl');
const ctl=document.getElementById('ctl'),bPlay=document.getElementById('bPlay'),bMute=document.getElementById('bMute');
const pr=document.getElementById('pr'),tm=document.getElementById('tm'),startOv=document.getElementById('startOv');
const prog=document.getElementById('prog'),knob=document.getElementById('knob');
// start of each step, used for the ticks on the seek bar
const STEPS=[[4.1,'Krok 2'],[12.2,'Krok 3'],[20.2,'Krok 4'],[29.3,'Krok 5'],[38.7,'Krok 6']];
const $=s=>stage.querySelector(s);
const END=49.0;
let silent=false,t=0,ci=0,playing=false,ended=false,last=null,tweens=[],paused=[],S=1,muted=false,actx=null,hideTimer=null,forceHide=false,sums=[0,0,0],hours=[48,48,48,48];
window.__ep={speed:1};

const fmt=(n,d)=>{const s=n.toFixed(d).split('.');const i=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');return s[1]?i+','+s[1]:i};
const mmss=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};

function beep(f,d,type,vol,delay){
  if(!actx||muted||silent)return;
  try{const o=actx.createOscillator(),g=actx.createGain(),st=actx.currentTime+(delay||0);
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.05,st);g.gain.exponentialRampToValueAtTime(.0001,st+d);

function seek(T,resume){

  for(ci=0;ci<CUES.length&&CUES[ci][0]<=T;ci++){
    const ct=CUES[ci][0];t=ct;
    const before=new Set(document.getAnimations());

    for(const a of document.getAnimations()){
      if(before.has(a)||(window.CSSTransition&&a instanceof CSSTransition))continue;
      try{const dt=(T-ct)*1000,end=a.effect?a.effect.getComputedTiming().endTime:0;if(isFinite(end)&&dt>=end)a.finish();else a.currentTime=dt}catch(e){}
    }
  }
  t=T;ended=T>=END;
  void stage.offsetHeight;
  stage.classList.remove('seeking');silent=false;
  if(resume&&!ended)play();else{pauseAll();updUI();showCtl()}
}
const jump=d=>{startOv.classList.add('hide');ensureAudio();seek(t+d,playing)};

function loop(ts){
  if(playing){
    if(last!==null)t+=Math.min(.1,(ts-last)/1000)*(window.__ep.speed||1);
    last=ts;
    while(ci<CUES.length&&CUES[ci][0]<=t){try{CUES[ci][1]()}catch(e){console.error(e)}ci++}
    if(t>=END){t=END;playing=false;ended=true;showCtl()}
  }else last=null;
  for(const w of tweens){if(t<w.start)continue;const p=Math.min(1,(t-w.start)/w.dur),e=1-Math.pow(1-p,3);if(w.el)w.el.textContent=fmt(w.from+(w.to-w.from)*e,w.dec)+w.suf}
  updUI();requestAnimationFrame(loop)}

document.getElementById('go').addEventListener('click',()=>{startOv.classList.add('hide');play()});
bPlay.addEventListener('click',()=>playing?pause():play());
document.getElementById('bRe').addEventListener('click',()=>{ensureAudio();startOv.classList.add('hide');restart()});
bMute.addEventListener('click',()=>{muted=!muted;updUI()});
document.getElementById('ticks').innerHTML=STEPS.map(s=>`<span class="tick" style="left:${s[0]/END*100}%" title="${s[1]}"></span>`).join('');
document.getElementById('bBack').addEventListener('click',()=>jump(-5));
document.getElementById('bFwd').addEventListener('click',()=>jump(5));
{
  let drag=false,resumeAfter=false,lastSeek=0;
  const posToT=e=>{const r=prog.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    for(const s of STEPS)if(Math.abs((s[0]/END-f)*r.width)<8)return s[0];return f*END};
  prog.addEventListener('pointerdown',e=>{drag=true;prog.classList.add('drag');prog.setPointerCapture(e.pointerId);resumeAfter=playing;startOv.classList.add('hide');seek(posToT(e),false);lastSeek=performance.now()});
  prog.addEventListener('pointermove',e=>{if(!drag)return;showCtl();const T=posToT(e);t=T;updUI();
    if(performance.now()-lastSeek>90){seek(T,false);lastSeek=performance.now()}});
  const up=e=>{if(!drag)return;drag=false;prog.classList.remove('drag');ensureAudio();seek(posToT(e),resumeAfter)};
  prog.addEventListener('pointerup',up);prog.addEventListener('pointercancel',up);
}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();startOv.classList.add('hide');playing?pause():play()}
  else if(k==='r'){startOv.classList.add('hide');ensureAudio();restart()}
  else if(k==='h'){forceHide=!forceHide;ctl.classList.toggle('hid',forceHide);if(!forceHide)showCtl()}
  else if(k==='m'){muted=!muted;updUI()}
  else if(e.key==='ArrowLeft'){e.preventDefault();jump(-5)}
  else if(e.key==='ArrowRight'){e.preventDefault();jump(5)}});
['mousemove','touchstart'].forEach(ev=>addEventListener(ev,showCtl,{passive:true}));
addEventListener('resize',fit);
build();requestAnimationFrame(loop);
}
</script>
